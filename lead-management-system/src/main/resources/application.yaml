
spring:
  application:
    name: LeadManagementSystem

  datasource:
    url: jdbc:mysql://localhost:3306/lead_management_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
